app:
  name: personal-agent
  version: 2.0.0
  env: dev
  docs_enabled: false

server:
  host: 0.0.0.0
  port: 9000
  workers: 1          # ⚠️ 必须为 1，GlobalGPULock 是进程级锁

# ==========================================
# GPU 资源池锁
# ==========================================
gpu:
  purge_on_start: true
  purge_on_shutdown: true

# ==========================================
# health（启动探活）
# ==========================================
health:
  fail_fast: true
  probe_timeout: 5
  check_ollama: true
  check_comfyui: false

# ==========================================
# 后台任务闸（task_runner）
# ==========================================
task:
  max_concurrent: 3        # 全局同时运行的后台任务数（可被 env TASK_MAX_CONCURRENT 覆盖）
  max_per_user: 2          # 单个用户同时运行的后台任务数（防一人占满全局闸）

# ==========================================
# 上传限制（file_upload_service 强制校验）
# ==========================================
upload:
  max_size_mb: 20          # 单文件上限
  max_total_mb: 100        # 单次请求多文件合计上限
  magic_check: true        # 校验文件头（防 .png 里装可执行内容）
  allowed_extensions:
    - jpg
    - jpeg
    - png
    - webp
    - bmp
    - gif
    - mp4
    - mov
    - avi
    - mkv
    - webm
    - mp3
    - wav
    - m4a
    - aac
    - ogg
    - flac
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - txt
    - md
    - csv
    - json

# ==========================================
# 服务注册 & 第三方工作流集成
# ==========================================
services:
  auth:
    base_url: http://localhost:8000
    read_timeout: 30
  sdxl:
    base_url: http://localhost:9001
    read_timeout: 600
  qwen_image:
    base_url: http://127.0.0.1:8188
    text_2_image_path: app/config/workflows/Qwen_Image_2.1_GGUF_Text2Image.json
    image_2_image_path: app/config/workflows/Qwen_Image_2.1_GGUF_Image2Image_Edit.json
    read_timeout: 600
    poll_interval: 3
    poll_timeout: 600
    timeout:
      connect: 8
      submit: 30
      query: 10
      download: 60
  face_swap:
    base_url: http://127.0.0.1:8188
    workflow_path: app/config/workflows/face_swap.json
    poll_interval: 3
    poll_timeout: 1800
    frame_load_cap: 150
    custom_width: 512
    custom_height: 512
  text_to_video:
    base_url: "http://127.0.0.1:8188"
    workflow_path: "./app/config/workflows/text_to_video.json"
    poll_interval: 5
    poll_timeout: 3600
    fps: 16
    max_length: 160
    nodes:
      positive_prompt: "6"
      negative_prompt: "7"
      sampler: "3"
      latent: "40"
      save_nodes: ["28", "47"]
    presets:
      standard:
        width: 640
        height: 360
        length: 48
        steps: 40
        cfg: 7.5
      hd:
        width: 832
        height: 480
        length: 48
        steps: 45
        cfg: 8.0
    default_width: 640
    default_height: 360
    default_length: 48
  image_to_video:
    base_url: "http://127.0.0.1:8188"
    workflow_path: "./app/config/workflows/wan_i2v.json"
    poll_interval: 5
    poll_timeout: 3600
    fps: 16
    max_length: 97
    default_length: 49
    nodes:
      start_image: "1"
      positive_prompt: "5"
      negative_prompt: "6"
      latent: "9"
      sampler: "10"
      save_nodes: ["12"]
    presets:
      standard:
        max_side: 512
        steps: 20
        cfg: 7.5
      hd:
        max_side: 640
        steps: 25
        cfg: 7.5
      ultra:
        max_side: 832
        steps: 30
        cfg: 7.5

  tts:
    unload_urls: []
    taskkill_enabled: false

  search:
    realtime_keywords: []
    realtime_patterns: []
    max_results: 3
    max_chars: 800
    fetcher:
      enabled: true
      max_urls: 3
      max_chars_per_url: 2000
      timeout: 8
      max_concurrent: 3
      cache_ttl: 3600
      circuit_threshold: 5
      circuit_cooldown: 300
      relevance_prefilter: true
      # ⭐ 出站抓取的 SSRF 防护（见 app/utils/net_guard.py）
      block_private_ips: true      # 拦截 127/10/172.16/192.168/169.254/::1 等
      max_redirects: 3             # 手动跟随重定向，每一跳都重新校验 IP

  searxng:
    base_url: ""

# ==========================================
# Ollama 模型服务与 GPU 调度策略
# ==========================================
ollama:
  base_url: "http://localhost:11434"

  hosts:
    # intent:    "http://gpu-a:11434"
    # chat:      "http://gpu-a:11434"
    # reasoning: "http://gpu-a:11434"
    # vision:    "http://gpu-b:11434"
    # ocr:       "http://gpu-b:11434"
    # embedding: "http://gpu-b:11434"

  timeout:
    connect: 8
    read_chat: 180
    read_stream: 120
    unload: 3

  models:
    intent: "qwen2.5:7b"
    intent_large: "qwen2.5:14b-instruct-q4_K_M"
    chat: "qwen2.5:7b"
    reasoning: deepseek-r1:14b
#    code: deepseek-coder-v2:16b
    # 用于日常快速代码编写
    code_fast: "deepseek-coder:6.7b"
    # 用于复杂代码重构，带 Think 过程
    code_think: "deepseek-r1:8b"

    vision: qwen2.5vl:7b
    ocr: qwen2.5vl:7b
    embedding: bge-m3:latest

  keep_alive:
    intent: "30m"
    intent_large: "0"
    chat: "30m"
    reasoning: "0"
#    code: "0"
    vision: "0"
    ocr: "0"
    embedding: "0"
    code_fast: "0"
    code_think: "0"

  num_predict:
    intent: 512              # L1/L2 意图分类只需 JSON，512 够
    intent_large: 1024
    chat: 2048
    code_fast: 2048
    code_think: 6144         # ⭐ think + 7 段输出，4096 可能不够
    vision: 1024
    ocr: 1024
    reasoning: 4096
    default: 4096            # 兜底
  num_ctx:
    default: 16384
    chat: 16384
    code_fast: 32768      # 8GB 显存实测可用；OOM 则下调到 24576/16384
    code_think: 32768

  default_num_ctx: 16384
  default_temperature: 0.6

code:
  history_max_turns: 40          # 历史最多取这么多条（真正装多少由 token 预算裁决）
  history_max_tokens: 6000       # 近窗对话 token 预算（替代旧版写死的 4000 字）
  project_map_max_tokens: 12000  # 项目地图预算
  task_state_max_tokens: 600     # 任务态注入预算
  module_map_max_tokens: 6000
  code_slices_max_tokens: 6000

# ==========================================
# 数据库与中间件（密钥走环境变量 / .env）
# ==========================================
mysql:
  host: localhost
  port: 3306
  database: agent
  charset: utf8mb4
  pool_size: 10
  user: root
  # ⚠️ 默认值只为本地开发；生产请删掉默认值，只留 ${MYSQL_PASSWORD}
  password: "${MYSQL_PASSWORD:-123456}"

redis:
  host: localhost
  port: 6379
  db: 0
  pool_size: 10
  token_expire_seconds: 86400
  # 无密码时留空（redis_client 会把空串当 None）
  password: "${REDIS_PASSWORD:-}"

auth:
  # ⚠️ 只放"没有用户态"的路径。业务路径一律不要放进来：
  # AuthInterceptor._is_white_list 是前缀匹配，一旦命中就直接返回 anonymous。
  white_list:
    - /auth/login
    - /auth/register
    - /health
    - /healthz
    - /readyz

  # 下载类接口授权策略：
  #   true  = 必须"签名有效"或"登录态+归属"（最终态）
  #   false = 过渡灰度：未签名且未登录也放行，仅打 warning
  require_download_auth: true
  # —— 运维端点守卫（本轮新增）———————————————————————————————
  # /metrics、/docs、/openapi.json 已从 white_list 移出，改由此守卫把关：
  #   配了 ops_token  -> 必须带 X-Ops-Token 或 Bearer <ops_token>
  #   否则配 ops_allow_ips -> 来源 IP 必须命中白名单
  #   两者都没配     -> 统一 404（隐藏端点存在，fail-closed）
  ops_paths:
    - /metrics
    - /docs
    - /docs/oauth2-redirect
    - /redoc
    - /openapi.json
  ops_token: ""
  ops_allow_ips: []
  ops_trust_forwarded_for: false
rate_limit:
  enabled: true
  default_qps: 10
  chat_qps: 5
  upload_qps: 2
  retention_seconds: 300
  sweep_interval: 60
  max_keys: 50000
  # —— 真实客户端 IP（本轮新增，反代后限流不再退化）——————————
  # remote_only = 仅当直连对端属于 trusted_proxies 时才信任转发头（推荐）
  # always      = 一定部署在可信反代后面时用；never = 永远只看 socket 对端
  trust_forwarded_for: remote_only
  prefer_real_ip: false
  trusted_proxies:
    - "127.0.0.1"
    - "::1"

# 文档解析相关（与上传白名单分开，互不影响）
file:
  max_file_tokens: 4096
  max_file_size_mb: 20
  allowed_extensions:
    - pdf
    - docx
    - xls
    - xlsx
    - txt
    - md
    - jpg
    - jpeg
    - png
    - webp

vector_store:
  path: ./data/chroma
  collection: knowledge_base
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5

# ==========================================
# Agent 编排配置
# ==========================================
agent:
  scheduler: router
  fc_enabled: false
  enabled: true
  context:
    enabled: true
    summary_trigger_count: 6
    summary_max_chars: 800
    summary_async: true
    summary_service: chat
    summary_model_key: chat
    summary_timeout_sec: 120
    qa_doc_max_tokens: 14000     # document_qa 不再固定 12000 头部截断
    window_size: 12              # 近窗从 10 提到 12（配合更大 num_ctx）

doc_processing:
  max_context_tokens: 8192
  reserved_tokens: 2500
  chars_per_token: 1.5
  chunk_size_chars: 4000

storyboard:
  mode: single
  image_width: 720
  image_height: 1080
  zoom_max: 1.15
  fps: 30
  output_width: 720
  output_height: 1280
  max_scenes: 6

# ==========================================
# TTS 配置
# ==========================================
tts:
  engine: cosyvoice2
  default_ref_audio: "./data/voices/anime_narrator.wav"

  cosyvoice2:
    base_url: "http://127.0.0.1:9011"
    timeout: 6000

  indextts2:
    base_url: "http://127.0.0.1:9010"
    timeout: 6000

tracing:
  console: false
  service: agent-v2
  otlp_endpoint: ""
  version: dev
  file: logs/spans.jsonl
  export_timeout: 10

# ==========================================
# 安全基线（本轮新增）
# ==========================================
cors:
  # 生产必须收敛成具体域名列表，例如：
  #   allow_origins: ["https://your-frontend.example.com"]
  # allow_credentials=true 时禁止 allow_origins 为 *（bootstrap 会强制降级）
  allow_origins: "*"
  allow_methods: "*"
  allow_headers: "*"
  allow_credentials: false

security:
  # 签名下载 URL 的默认时效（秒）。默认 7 天；到期后前端重新拉消息/任务即可换新链接。
  default_url_ttl_seconds: 604800
  # tts / liveportrait_job 没有可靠归属元数据，默认禁止显式签发签名（fail-closed）。
  # 置 true 会重新允许越权签发，属危险开关。
  allow_sign_ownerless: false

# 签名密钥（不在 yml 里存值，只从环境变量读；未配置则服务启动即失败）
#   SIGNED_URL_SECRET=<openssl rand -hex 32>
#   SIGNED_URL_DEFAULT_TTL=604800
#   SIGNED_URL_ALLOW_LEGACY_PERMANENT=true    # 灰度期兼容 exp=0 老链接，收口后置 false

code_workspace:
  ttl_hours: 24
  max_total_mb: 200
  max_file_mb: 2
  max_files: 3000
  upload_batch_files: 30

code_scan:
  map_model: code_fast
  reduce_model: code_think
  chunk_tokens: 1200
  chunk_overlap_tokens: 120
  map_max_tokens: 800
  reduce_max_tokens: 2000
  retry: 2
  token_est_ratio: 3
  yield_sleep_ms: 150

code_context:
  recent_turns: 12
  max_context_tokens: 6000
  summary_trigger_tokens: 4000



