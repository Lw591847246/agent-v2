app:
  name: personal-agent
  version: 2.0.0
  env: dev

server:
  host: 0.0.0.0
  port: 9000
  workers: 1          # ⚠️ 必须为 1，GlobalGPULock 是进程级锁

# ==========================================
# GPU 资源池锁（新增）
# ==========================================
gpu:
  purge_on_start: true       # 启动清场（清掉上次进程残留显存）
  purge_on_shutdown: true    # 关闭清场（可选，建议 true）

# ==========================================
# health（启动探活）
# ==========================================
health:
  fail_fast: true                # true=Ollama 不通则阻断启动；false=仅告警
  probe_timeout: 5               # 单次探活超时
  check_ollama: true             # Ollama 核心，建议 true
  check_comfyui: false           # 图/视频链路存在再开


# ==========================================
# 服务注册 & 第三方工作流集成
# ==========================================
services:
  auth:
    base_url: http://localhost:8000
    read_timeout: 30
  sdxl:
    base_url: http://localhost:9001
    read_timeout: 600
  qwen_image:
    base_url: http://127.0.0.1:8188
    text_2_image_path: app/config/workflows/Qwen_Image_2.1_GGUF_Text2Image.json
    image_2_image_path: app/config/workflows/Qwen_Image_2.1_GGUF_Image2Image_Edit.json
    read_timeout: 600
    poll_interval: 3             # 轮询间隔
    poll_timeout: 600            # 轮询总时长上限
    timeout:
      connect: 8                 # 建连：进程没起/端口不通秒级失败
      submit: 30                 # /prompt 提交、/upload 上传 单次 read
      query: 10                  # /history 单次 read
      download: 60               # /view 下载 read
  face_swap:
    base_url: http://127.0.0.1:8188
    workflow_path: app/config/workflows/face_swap.json
    poll_interval: 3
    poll_timeout: 1800
    frame_load_cap: 150
    custom_width: 512
    custom_height: 512
  text_to_video:
    base_url: "http://127.0.0.1:8188"
    workflow_path: "./app/config/workflows/text_to_video.json"
    poll_interval: 5
    poll_timeout: 3600
    fps: 16
    max_length: 160
    nodes:
      positive_prompt: "6"
      negative_prompt: "7"
      sampler: "3"
      latent: "40"
      save_nodes: ["28", "47"]
    presets:
      standard:
        width: 640
        height: 360
        length: 48
        steps: 40
        cfg: 7.5
      hd:
        width: 832
        height: 480
        length: 48
        steps: 45
        cfg: 8.0
    default_width: 640
    default_height: 360
    default_length: 48
  image_to_video:
    base_url: "http://127.0.0.1:8188"
    workflow_path: "./app/config/workflows/wan_i2v.json"
    poll_interval: 5
    poll_timeout: 3600
    fps: 16
    max_length: 97
    default_length: 49
    nodes:
      start_image: "1"
      positive_prompt: "5"
      negative_prompt: "6"
      latent: "9"
      sampler: "10"
      save_nodes: ["12"]
    presets:
      standard:
        max_side: 512
        steps: 20
        cfg: 7.5
      hd:
        max_side: 640
        steps: 25
        cfg: 7.5
      ultra:
        max_side: 832
        steps: 30
        cfg: 7.5

  tts:
    # TTS 上游卸载端点（多个 URL 会依次尝试）
    # 你的 CosyVoice2 / IndexTTS2 如果有 /unload、/api/unload 之类的端点，填进来
    # 留空 [] 则自动探测（/unload /api/unload /v1/unload /release /free）
    unload_urls: []
    # 所有 URL 都失败时是否 taskkill 兜底
    # ⚠️ 本代码仅在 gpu_unloaders.py 里打印告警，不会主动 kill 进程
    taskkill_enabled: false

  search:
    realtime_keywords: []
    realtime_patterns: []
    max_results: 3
    max_chars: 800
    fetcher:
      enabled: true
      max_urls: 3
      max_chars_per_url: 2000
      timeout: 8
      max_concurrent: 3
      cache_ttl: 3600
      circuit_threshold: 5
      circuit_cooldown: 300
      relevance_prefilter: true

  searxng:
    base_url: ""


# ==========================================
# Ollama 模型服务与 GPU 调度策略
# ==========================================
ollama:
  # ⭐ 必须是不带路径的 host！
  # 原值 "http://localhost:11434/api/chat" 会让 unload_ollama 拼成
  # ".../api/chat/api/generate" 而 404
  # 新 unload_ollama 已加 _strip_api_path 兜底，但推荐直接改成纯 host
  base_url: "http://localhost:11434"

  # 可选：多机分片时按 service 覆盖源；未覆盖的自动回落 base_url
  # 单机部署时整段可不写，行为与现在一致
  hosts:
    # intent:    "http://gpu-a:11434"
    # chat:      "http://gpu-a:11434"
    # reasoning: "http://gpu-a:11434"
    # vision:    "http://gpu-b:11434"
    # ocr:       "http://gpu-b:11434"
    # embedding: "http://gpu-b:11434"

  # 分层超时（秒）
  timeout:
    connect: 8        # 建连：源没起 / 端口不通时秒级失败，不再空等 read
    read_chat: 180    # 非流式：等完整响应
    read_stream: 120  # 流式：相邻块间隔，同时充当首 token 超时
    unload: 3         # keep_alive=0 卸载请求的超时

  models:
    intent: "qwen2.5:7b"
    intent_large: "qwen2.5:14b-instruct-q4_K_M"
    chat: "qwen2.5:7b"
    reasoning: deepseek-r1:14b
    code: deepseek-coder-v2:16b
    vision: qwen2.5vl:7b
    ocr: qwen2.5vl:7b
    embedding: bge-m3:latest

  # ⭐ 显存常驻策略
  # 说明：
  #   "-1"  → 永不卸载（4.7G 一直占着）
  #   "0"   → 用完立刻卸载
  #   "30m" → 空闲 30 分钟后卸载
  # GPU 锁会在切换到其他资源（ComfyUI / TTS / LP）时主动对 ALL 模型发 keep_alive=0，
  # 所以 "intent: -1" 的常驻在切换时也会被强制卸载——
  # 建议改成 "30m"，避免每次切走再切回都重加载 7B（加载 3-5 秒）。
  keep_alive:
    intent: "30m"          # 从 "-1" 改为 "30m"
    intent_large: "0"
    chat: "30m"            # 与 intent 同模型时共驻留
    reasoning: "0"
    code: "0"
    vision: "0"
    ocr: "0"
    embedding: "0"

  default_num_ctx: 16384
  default_temperature: 0.6


# ==========================================
# 数据库与中间件
# ==========================================
mysql:
  host: localhost
  port: 3306
  database: agent
  charset: utf8mb4
  pool_size: 10
  user: root
  password: "123456"

redis:
  host: localhost
  port: 6379
  db: 0
  password: null
  pool_size: 10
  token_expire_seconds: 86400

auth:
  white_list:
    - /auth/login
    - /auth/register
    - /docs
    - /openapi.json
    - /health
    - /agent/v1/thumb/
    - /agent/v1/image/
    - /agent/v1/upload/thumb/

rate_limit:
  enabled: true
  default_qps: 10
  chat_qps: 5
  upload_qps: 2
  retention_seconds: 300         # key 闲置多久可回收（须 > 1s 窗口）
  sweep_interval: 60             # 两次清扫最小间隔
  max_keys: 50000                # key 总量硬上限，逼近即强制清扫

file:
  max_file_tokens: 4096
  max_file_size_mb: 20
  allowed_extensions:
    - pdf
    - docx
    - xls
    - xlsx
    - txt
    - md
    - jpg
    - jpeg
    - png
    - webp

vector_store:
  path: ./data/chroma
  collection: knowledge_base
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5


# ==========================================
# Agent 编排配置
# ==========================================
agent:
  scheduler: router
  fc_enabled: false
  enabled: true
  context:
    enabled: true
    window_size: 10
    summary_trigger_count: 6
    summary_max_chars: 800
    summary_async: true
    summary_service: chat
    summary_model_key: chat
    summary_timeout_sec: 120

doc_processing:
  max_context_tokens: 8192
  reserved_tokens: 2500
  chars_per_token: 1.5
  chunk_size_chars: 4000

storyboard:
  mode: single
  image_width: 720
  image_height: 1080
  zoom_max: 1.15
  fps: 30
  output_width: 720
  output_height: 1280
  max_scenes: 6


# ==========================================
# TTS 配置
# ==========================================
tts:
  # ⭐ 切换引擎只需改这里
  engine: cosyvoice2

  default_ref_audio: "./data/voices/anime_narrator.wav"

  cosyvoice2:
    base_url: "http://127.0.0.1:9011"
    # ⚠️ 6000 秒 = 100 分钟，如果你 TTS 真的会跑这么久就保留；
    # 否则建议改 300（5 分钟），避免一次卡死把 sem 占 100 分钟
    timeout: 6000

  indextts2:
    base_url: "http://127.0.0.1:9010"
    timeout: 6000